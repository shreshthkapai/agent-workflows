# Agent workflows model registry. Shared by Claude Code, Codex, and Grok.
# Installed to ~/.config/agent-workflows/models.toml; edit that copy, or run /setup-pstack.
# Resolve a role with `aw-run --resolve <role>`. Run a cross-provider role with `aw-run <role>`.

# Starting effort for every role. unlimited = max, large = xhigh, medium = high, small = medium.
budget = "large"

# Each model names the CLI that runs it (claude, codex, or grok), so each call bills that CLI's plan.
# Use any mix of plans. A model whose CLI is not installed resolves to the first installed model
# in its `fallback` chain, which is also where `aw-run` retries when a provider reports a usage limit.

[models.opus]
provider = "claude"
model = "opus"
fallback = ["sol", "grok"]

[models.sol]
provider = "codex"
model = "gpt-6.1-sol"
fallback = ["grok", "opus"]

[models.grok]
provider = "grok"
model = "grok-4.7"
fallback = ["sol", "opus"]

# One line per role, as in upstream setup-pstack. An entry is model, model:effort, or model:effort:fast
# (Codex models only). A list is a panel, one subagent per entry. "inherit" runs on the parent session's model.
[roles]
feature_refactoring = "sol"
bug_fix = "sol"
perf_issue = "sol"
hillclimb = "sol"
judgment_prose = "opus"
hardest_tasks = "opus"
how_explorer = "sol"
how_explainer = "opus"
why_investigators = "sol"
why_synthesizer = "opus"
reflect_tooling = "sol"
reflect_judgment = "opus"
arena_runners = ["opus", "sol"]
arena_cross_judge_pool = ["opus", "sol"]
swarm_workers = "sol"
architect_runners = ["opus", "sol"]
interrogate_reviewers = ["opus", "sol"]
comment_sicko = "sol"
delegate = "sol"
